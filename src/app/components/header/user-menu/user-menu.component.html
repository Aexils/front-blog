<div *ngIf="isLoggedIn()" class="relative inline-block text-left">
  <!-- Avatar button -->
  <button
    (click)="toggleMenu()"
    class="flex items-center justify-center w-10 h-10 rounded-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-slate-800 hover:shadow-sm"
    aria-label="Menu utilisateur"
  >
    <img src="/icons/user.svg" alt="Avatar" class="w-6 h-6" />
  </button>

  <!-- Dropdown -->
  <div
    *ngIf="showMenu()"
    class="absolute right-0 mt-2 w-56 origin-top-right rounded-md shadow-lg bg-white dark:bg-slate-800 ring-1 ring-black ring-opacity-5 focus:outline-none z-50"
  >
    <div class="py-1 text-sm text-gray-700 dark:text-gray-100">
      <a
        (click)="navigateTo('/dashboard')"
        class="block px-4 py-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-slate-700"
      >
        🏠 Dashboard
      </a>
      <a
        (click)="navigateTo('/update-password')"
        class="block px-4 py-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-slate-700"
      >
        🔐 Modifier le mot de passe
      </a>
      <button
        (click)="logout()"
        class="w-full text-left px-4 py-2 hover:bg-gray-100 dark:hover:bg-slate-700"
      >
        🚪 Déconnexion
      </button>
      <div class="px-4 py-2 border-t border-gray-200 dark:border-slate-600">
        <button
          (click)="toggleTheme()"
          class="flex items-center gap-2 text-sm hover:underline"
        >
          <img
            class="h-4 w-4"
            [src]="theme() === 'dark' ? '/icons/moonIcon.svg' : '/icons/sunIcon.svg'"
            alt="Thème"
          />
          {{ theme() === 'dark' ? 'Thème sombre' : 'Thème clair' }}
        </button>
      </div>
    </div>
  </div>
</div>
